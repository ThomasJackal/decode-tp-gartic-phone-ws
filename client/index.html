<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartic Phone WS</title>
    <style>
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .site-header h1 {
            margin: 0;
        }

        .site-header p {
            margin: 0;
        }

        section h2 {
            text-align: center;
        }

        .drawing-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .drawing-toolbar {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            margin-top: 0.75rem;
        }

        .drawing-canvas-wrap {
            width: 100%;
            max-width: 800px;
        }

        .drawing-canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 500;
            border: 1px solid #000;
            cursor: crosshair;
        }

        .view-canvas {
            cursor: default;
        }

        .naming-form {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .naming-form input {
            min-width: 12rem;
        }
    </style>
    <script src="./index.js" defer></script>
</head>
<body>
    <main>
        <header class="site-header">
            <h1>Gartic Phone WS</h1>
            <p id="connectionStatus">Connecting to websocket...</p>
        </header>

        <section id="screen-menu">
            <h2>Menu</h2>
            <label>
                Username
                <input type="text" id="username" placeholder="thomas">
            </label>
            <p>
                <button type="button" id="joinGameBtn">Join</button>
            </p>
        </section>

        <section id="screen-pre-start" hidden>
            <h2>Lobby</h2>
            <ul id="playersList"></ul>
            <button type="button" id="startGameBtn" hidden>Start</button>
        </section>

        <section id="screen-first-word" hidden>
            <h2>First word</h2>
            <p>Give the first word of your thread.</p>
            <div id="firstWordForm">
                <input type="text" id="firstWordInput" placeholder="banana wizard">
                <p>
                    <button type="button" id="submitFirstWordBtn">Submit word</button>
                </p>
            </div>
            <p id="firstWordWaiting" hidden>Waiting for all players...</p>
        </section>

        <section id="screen-drawing" hidden>
            <h2>Drawing</h2>
            <header class="drawing-header">
                <p class="drawing-prompt">Draw: <strong id="drawingWord">-</strong></p>
                <p class="drawing-time">Time left: <span id="drawingTimer">60</span>s</p>
            </header>
            <div class="drawing-canvas-wrap">
                <canvas id="drawingCanvas" class="drawing-canvas" width="800" height="500"></canvas>
            </div>
            <div id="drawingToolbar" class="drawing-toolbar">
                <label>
                    Color
                    <input type="color" id="drawColor" value="#111111">
                </label>
                <label>
                    Thickness
                    <input type="range" id="drawThickness" min="1" max="16" value="4">
                </label>
            </div>
        </section>

        <section id="screen-naming" hidden>
            <h2>Naming</h2>
            <header class="drawing-header">
                <div id="namingForm" class="naming-form">
                    <input type="text" id="namingInput" placeholder="sad fish at work">
                </div>
                <p class="drawing-time">Time left: <span id="namingTimer">10</span>s</p>
            </header>
            <div class="drawing-canvas-wrap">
                <canvas id="namingCanvas" class="drawing-canvas view-canvas" width="800" height="500"></canvas>
            </div>
        </section>
    </main>
</body>
</html>
